name: Deploy

# Build this learning pack into a static app on the quizmill engine and
# publish it to Cloudflare Pages (project `quizmill-claude-cert-developer` →
# claude-cert-developer.quizmill.dev). The build+deploy recipe is shared across all
# quizmill pack apps and lives in the engine repo
# (quizmill/quizmill/.github/workflows/deploy-pack.yml) — this file just
# wires up the triggers and secrets.
#
# Triggers:
#   push to main          — content changed, redeploy now
#   repository_dispatch   — the engine shipped a new version (fanned out by
#     (engine-update)       the engine's Release workflow); rebuild on that
#                           exact version
#   schedule (daily)      — safety net: picks up engine releases even if a
#                           dispatch was missed
#   workflow_dispatch     — manual
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN                   token with "Cloudflare Pages — Edit" (org-level)
#   CLOUDFLARE_ACCOUNT_ID                  70b494550992cda97e893fab035f7e9a
#   NEXT_PUBLIC_SUPABASE_URL               https://hddqsimdhulexdkbibfx.supabase.co
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY   sb_publishable_… (public-safe; RLS guards)

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [engine-update]
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

jobs:
  # Create the Cloudflare Pages project on first run — `wrangler pages
  # deploy` does not auto-create it. Idempotent: a no-op once it exists.
  ensure-project:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create quizmill-claude-cert-developer \
            --production-branch=main \
          || echo "project already exists (or create skipped) — continuing"

      # Attach the custom domain (wrangler has no command for it, so the
      # Pages API). Idempotent: Cloudflare answers "already added" after the
      # first run. Prints the domain's status for the run log.
      - name: Ensure custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret (it is in this file's header too); the repo has no
          # CLOUDFLARE_ACCOUNT_ID secret and the raw API call needs it.
          CLOUDFLARE_ACCOUNT_ID: 70b494550992cda97e893fab035f7e9a
          PROJECT: quizmill-claude-cert-developer
          DOMAIN: claude-cert-developer.quizmill.dev
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          curl -sS -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" --data "{\"name\":\"$DOMAIN\"}" \
            | jq -c '{success, errors: [.errors[]?.message], status: .result.status}' || true
          curl -sS "$api/$DOMAIN" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -c '{success, errors: [.errors[]?.message], status: .result.status, verification: .result.verification_data, validation: .result.validation_data}' || true
          # DNS: a proxied CNAME to the project's pages.dev host, created only
          # if the name has no record yet (the dashboard does this on its own;
          # the API does not).
          zone=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=quizmill.dev" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then echo "dns: token cannot read the quizmill.dev zone — add the CNAME by hand"; exit 0; fi
          have=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$DOMAIN" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result | length')
          if [ "$have" = "0" ]; then
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" \
              | jq -c '{dns: "create", success, errors: [.errors[]?.message]}' || true
          else
            echo "dns: $DOMAIN already has a record"
          fi

  deploy:
    needs: ensure-project
    uses: quizmill/quizmill/.github/workflows/deploy-pack.yml@main
    with:
      project: quizmill-claude-cert-developer
      app: claude-cert-developer-app
      engine: ${{ github.event.client_payload.version || 'latest' }}
      # Cloud sync via the shared quizmill-sync Worker/D1 (sync-key auth).
      # Public by design — this URL ships in the client bundle. The worker
      # also still answers on quizmill-sync.peter-vanhee.workers.dev for
      # builds that predate the custom domain.
      sync_url: https://sync.quizmill.dev
      # Anonymous funnel beacon (six events, random device id, off switch in
      # Settings) -> the sync worker's analytics route. Public by design.
      analytics_url: https://sync.quizmill.dev/v1/analytics
      privacy_url: https://quizmill.dev/privacy
    secrets: inherit
